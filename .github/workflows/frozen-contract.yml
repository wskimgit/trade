name: Frozen Contract

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
      - name: Check frozen identity markers
        run: php scripts/check_frozen_markers.php
