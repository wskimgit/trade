name: Deploy Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NAS deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp src/trade_engine.php bundle/
          cp src/trade_broker.php bundle/
          cp src/trade_runner.php bundle/
          cp src/trade_runner_control.php bundle/
          cp src/trade_runner_status.php bundle/
          cp src/trade_runner_preflight.php bundle/
          cp src/trade_3plus1_preflight.php bundle/
          cp src/trade_dashboard.php bundle/
          cp tests/regression_order_path_recovery.php bundle/
          (
            cd bundle
            sha256sum trade_engine.php trade_broker.php trade_runner.php trade_runner_control.php trade_runner_status.php trade_runner_preflight.php trade_3plus1_preflight.php trade_dashboard.php > SHA256SUMS.txt
          )
          cat > bundle/DEPLOY_README.txt <<'EOF'
          Trade 3+1 order-path recovery deployment bundle
          Date: 2026-09-23

          Replace these eight operational files in /volume1/web:
          - trade_engine.php
          - trade_broker.php
          - trade_runner.php
          - trade_runner_control.php
          - trade_runner_status.php
          - trade_runner_preflight.php
          - trade_3plus1_preflight.php
          - trade_dashboard.php

          Required sequence:
          1) Back up the existing eight files.
          2) Replace the eight files together as one coherent set.
          3) In trade_runner_control.php: STOP, wait for STOPPED, then START.
          4) Confirm installed Runner and daemon both report v1.4.6.
          5) Run trade_3plus1_preflight.php and require PASS.
          6) Export a new chatgpt_trade_UNIFIED_*.json for live verification.

          Do not delete strategy runtimes or live position/order state.
          Authority remains SINGLE_FILE_PAPER and REAL=false.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: TRADE_ORDER_PATH_RECOVERY_20260923
          path: bundle/
          if-no-files-found: error
          retention-days: 30
